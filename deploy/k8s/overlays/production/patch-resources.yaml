apiVersion: batch/v1
kind: Job
metadata:
  name: agentloom-workflow
spec:
  template:
    spec:
      containers:
        - name: agentloom
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.observability.svc.cluster.local:4317"
          resources:
            requests:
              memory: 256Mi
              cpu: 200m
            limits:
              memory: 512Mi
