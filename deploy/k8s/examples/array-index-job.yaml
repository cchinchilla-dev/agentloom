apiVersion: v1
kind: ConfigMap
metadata:
  name: array-index-script
  namespace: agentloom
data:
  validate_array_index.py: |
    """Functional validation of array index state paths in Kubernetes."""

    import anyio

    from agentloom.core.engine import WorkflowEngine
    from agentloom.core.models import (
        StepDefinition,
        StepType,
        WorkflowConfig,
        WorkflowDefinition,
    )
    from agentloom.core.results import TokenUsage, WorkflowStatus
    from agentloom.providers.base import BaseProvider, ProviderResponse
    from agentloom.providers.gateway import ProviderGateway


    class EchoProvider(BaseProvider):
        name = "echo"
        async def complete(self, messages, model, **kwargs):
            return ProviderResponse(
                content=messages[-1]["content"],
                model=model,
                provider="echo",
                usage=TokenUsage(prompt_tokens=5, completion_tokens=7, total_tokens=12),
                cost_usd=0.0,
                finish_reason="stop",
            )
        def supports_model(self, model):
            return True


    def _wf():
        return WorkflowDefinition(
            name="array-index-k8s",
            config=WorkflowConfig(provider="echo", model="mock-model"),
            state={"items": ["alpha", "beta", "gamma"]},
            steps=[
                StepDefinition(
                    id="pick_first", type=StepType.LLM_CALL,
                    prompt="The first item is: {state.items[0]}. Repeat it back.",
                    output="result",
                ),
            ],
        )


    async def main() -> None:
        gw = ProviderGateway()
        gw.register(EchoProvider(), models=["mock-model"])
        engine = WorkflowEngine(_wf(), provider_gateway=gw)
        result = await engine.run()
        assert result.status == WorkflowStatus.SUCCESS, result.status
        reply = result.final_state["result"]
        assert reply == "The first item is: alpha. Repeat it back.", reply
        print(f"[ok] array-index-k8s validation passed: {reply}")


    anyio.run(main)
---
apiVersion: batch/v1
kind: Job
metadata:
  name: array-index-smoke
  namespace: agentloom
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 600
  activeDeadlineSeconds: 300
  template:
    spec:
      serviceAccountName: agentloom
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runner
          image: ghcr.io/cchinchilla-dev/agentloom:latest
          command: ["python", "/scripts/validate_array_index.py"]
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 256Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: array-index-script
