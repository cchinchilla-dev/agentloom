version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A release younger than a week waits: a compromised one is usually pulled by then
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope
    labels: [dependencies, ci]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # Only uv.lock moves: the minimums in pyproject.toml are what the lowest-dependencies job tests
    versioning-strategy: lockfile-only
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope
    labels: [dependencies]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # The image's Python version is a choice, not something to track
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      docker:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope
    labels: [dependencies, infrastructure]
