name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "overrides/**"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false  # gh-deploy pushes through gh instead
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v8
        with:
          enable-cache: true
      - run: uv sync --group docs
      - name: Deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          uv run mkdocs gh-deploy --force --strict
