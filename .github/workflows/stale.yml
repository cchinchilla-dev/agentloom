name: Stale

on:
  schedule:
    - cron: "0 9 * * 1" # Monday 9am UTC
  workflow_dispatch:

permissions:
  issues: write

jobs:
  stale:
    name: Close stale questions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@b5d41d4e1d5dceea10e7104786b73624c18a190f  # v10
        with:
          # Only issues waiting on the reporter; roadmap and backlog issues are never touched
          only-issue-labels: "question"
          days-before-issue-stale: 30
          days-before-issue-close: 7
          stale-issue-label: stale
          stale-issue-message: >
            This question has been automatically marked as stale because it has had no
            activity in the last 30 days while waiting for more information. It will be
            closed in 7 days if no further activity occurs.
          close-issue-message: Closed because the requested information was not provided. Feel free to reopen with the details.
          days-before-pr-stale: -1
          exempt-issue-labels: "pinned,help wanted,good first issue"
