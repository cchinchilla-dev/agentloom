name: Release

on:
  push:
    tags: ["v*"]
  # Auto Tag runs only on a push to main: no pull request's code reaches this run
  workflow_run:  # zizmor: ignore[dangerous-triggers]
    workflows: ["Auto Tag"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-tag:
    name: Resolve tag
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push'
      || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'workflow_run'
          && github.event.workflow_run.conclusion == 'success')
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          # workflow_run: check out the exact commit from the triggering run
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Determine tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            # push: tag ref is available directly
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            # workflow_run: tag points at HEAD (the auto-tag commit)
            # workflow_dispatch: HEAD may be ahead, fall back to nearest tag
            TAG=$(git tag --points-at HEAD 'v*' | head -1)
            if [[ -z "${TAG}" ]]; then
              TAG=$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || echo "")
            fi
            if [[ -z "${TAG}" ]]; then
              echo "::error::No version tag found"
              exit 1
            fi
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build
    needs: resolve-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          ref: refs/tags/${{ needs.resolve-tag.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v8
        with:
          # No cache in a release build: a poisoned one would reach the published packages
          enable-cache: false
      - run: uv build
      # The wheel and the sdist must carry the tag's version and install and run before they ship
      - name: Check the distributions
        env:
          TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: scripts/check_dist.sh dist "${TAG#v}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: dist
          path: dist/

  release:
    name: GitHub Release
    needs: [resolve-tag, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          ref: refs/tags/${{ needs.resolve-tag.outputs.tag }}
          persist-credentials: false

      - name: Release notes from the changelog
        env:
          TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          awk -v head="## [${TAG#v}]" '
            index($0, head) == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || { echo "::error::CHANGELOG.md has no section for $TAG"; exit 1; }

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: dist
          path: dist/

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: >-
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag
          --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"

  docker:
    name: Docker image
    needs: [resolve-tag, build]
    permissions:
      contents: read
      packages: write
    # actionlint does not know the self-repository syntax ($/) yet
    uses: ./.github/workflows/docker.yml  # zizmor: ignore[self-repository]
    with:
      tag: ${{ needs.resolve-tag.outputs.tag }}

  publish:
    name: Publish to PyPI
    needs: [resolve-tag, build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3

  docs:
    name: Publish the docs
    needs: [resolve-tag, publish]
    runs-on: ubuntu-latest
    # Its secret is a token that can only start the blog's workflows; the environment limits it to main and v* tags
    environment: blog-dispatch
    permissions: {}
    steps:
      # The blog publishes the docs of the version PyPI serves, so it must serve this one first
      - name: Wait for PyPI
        env:
          TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          for _ in $(seq 20); do
            served=$(curl -fsS https://pypi.org/pypi/agentloom/json | jq -r .info.version) || served=""
            if [ "$served" = "${TAG#v}" ]; then exit 0; fi
            sleep 15
          done
          echo "::warning::PyPI does not serve ${TAG#v} yet: the blog keeps the previous docs until this job is re-run."
      # A failed start leaves the release published: the blog's build can be started from its Actions tab
      - name: Rebuild the blog
        env:
          GH_TOKEN: ${{ secrets.BLOG_DISPATCH_TOKEN }}
        run: >-
          gh workflow run ci.yml --repo cchinchilla-dev/blog --ref main
          || echo "::warning::Could not start the blog's build; start ci.yml in cchinchilla-dev/blog by hand."
