name: Docker

# A release's image is built when release.yml calls this workflow with the tag (the tag that
# Auto Tag pushes starts no workflow itself), or by hand for a tag that has none.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      tag:
        description: Release tag to build (vX.Y.Z)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build & Push
    runs-on: ubuntu-latest
    # A release build runs from main's context too: the tag keeps it apart from main's own build
    concurrency:
      group: docker-${{ inputs.tag || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Resolve the build
        id: build
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            # Only the newest release moves `latest`: an older tag built by hand leaves it
            newest=$(git ls-remote --tags --refs "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" 'v*' \
              | sed 's#.*refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
            {
              echo "release=true"
              echo "ref=refs/tags/$TAG"
              echo "version=${TAG#v}"
              echo "latest=$([ "$TAG" = "$newest" ] && echo true || echo false)"
            } >> "$GITHUB_OUTPUT"
          else
            echo "::error::'$TAG' is not a release tag (vX.Y.Z)"
            exit 1
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          ref: ${{ steps.build.outputs.ref }}
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5
        with:
          images: ghcr.io/cchinchilla-dev/agentloom
          tags: |
            type=ref,event=pr
            type=sha,prefix=main-,enable=${{ steps.build.outputs.release == 'false' && github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},value=${{ steps.build.outputs.version }},enable=${{ steps.build.outputs.release }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.build.outputs.version }},enable=${{ steps.build.outputs.release }}
            type=raw,value=latest,enable=${{ steps.build.outputs.latest == 'true' }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          platforms: ${{ steps.build.outputs.release == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: BUILD_OBSERVABILITY=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        if: github.event_name == 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          IMAGE=$(echo "$TAGS" | head -n 1)
          docker run --rm "$IMAGE" validate /workflows/01_simple_qa.yaml

      - name: Smoke test the release image
        if: steps.build.outputs.release == 'true'
        env:
          IMAGE: ghcr.io/cchinchilla-dev/agentloom:${{ steps.build.outputs.version }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          info=$(docker run --rm "$IMAGE" info)
          grep -qF "AgentLoom v$VERSION" <<<"$info" || { echo "::error::$IMAGE is not $VERSION"; exit 1; }
