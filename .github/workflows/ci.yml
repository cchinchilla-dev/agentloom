name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v8
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run ruff check src/ tests/
      - run: uv run ruff format --check src/ tests/
      - run: uv run mypy src/
      - run: uv run zizmor --offline .github/

  test:
    # Branch protection requires the Linux jobs by name: they stay "Test (Python X.Y)"
    name: Test (Python ${{ matrix.python-version }}${{ matrix.os-name && format(', {0}', matrix.os-name) || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            os-name: macOS
            python-version: "3.14"
          - os: windows-latest
            os-name: Windows
            python-version: "3.14"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v8
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --group dev --all-extras
      - run: uv run pytest --cov=agentloom --cov-report=xml --cov-report=term-missing
      # Coverage upload is informational — the test suite is the quality
      # gate. The uploader verifies its own downloaded CLI's GPG signature,
      # and that step has been failing persistently ("gpg: no valid OpenPGP
      # data found" → "Can't check signature: No public key"), turning every
      # post-merge push CI red even though all tests passed. ``fail_ci_if_error``
      # only governs upload errors, not this binary-verification failure, so
      # ``continue-on-error`` is what actually keeps a Codecov infra failure
      # from blocking main. The codecov/patch status check still reports on PRs.
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        if: matrix.python-version == '3.12' && runner.os == 'Linux'
        continue-on-error: true
        with:
          files: coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  lowest:
    name: Test (lowest dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v8
        with:
          enable-cache: true
          python-version: "3.11"
      # The lowest versions pyproject.toml allows, not the lock's: each minimum must hold
      - run: uv sync --resolution lowest-direct --group dev --all-extras
      # pydantic before 2.10 writes a Literal as `enum` next to `const`: the same schema, though
      # not the committed text, so only the check that the committed file is regenerated stays out
      - run: >-
          uv run --no-sync pytest
          --deselect tests/core/test_inter_agent.py::test_committed_schema_matches_the_models

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v8
        with:
          enable-cache: true
      - run: uv run --group docs mkdocs build --strict

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v8
        with:
          enable-cache: true
      - run: uv build
      # What release.yml checks before it publishes, on every change
      - run: scripts/check_dist.sh dist

  version-linearity:
    # Branch protection requires this check by name: rename it there first
    name: Version linearity (pyproject ↔ CHANGELOG)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
      - run: python scripts/check_version_linearity.py

  manifests:
    name: Validate K8s manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      - name: Install tools
        run: |
          curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.6.0/kustomize_v5.6.0_linux_amd64.tar.gz" | tar xz -C /usr/local/bin
          curl -sL "https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz" | tar xz -C /usr/local/bin
          curl -sL "https://get.helm.sh/helm-v3.16.4-linux-amd64.tar.gz" | tar xz --strip-components=1 -C /usr/local/bin linux-amd64/helm
      - name: Validate Kustomize overlays
        run: |
          for overlay in dev staging production; do
            echo "--- ${overlay} ---"
            kustomize build "deploy/k8s/overlays/${overlay}" | kubeconform -strict -summary
          done
      - name: Lint and validate Helm chart
        run: |
          helm lint deploy/helm/agentloom -f deploy/helm/agentloom/ci/test-values.yaml
          helm template test deploy/helm/agentloom -f deploy/helm/agentloom/ci/test-values.yaml -n agentloom | kubeconform -strict -summary
