name: circuit-breaker-demo
version: "1.0"
description: >
  Demonstrates the circuit breaker pattern. Run it with Ollama stopped: refused
  connections are retried, and after 5 consecutive failures the circuit opens, so
  the last step fails without reaching the provider. With Ollama running, the
  missing model answers 404, which isn't retried, and the circuit stays closed.

config:
  provider: ollama
  model: nonexistent-model-for-demo
  on_step_failure: continue  # the last step must run after its parents fail

state:
  prompt_a: "What is 2+2?"
  prompt_b: "What is the capital of France?"
  prompt_c: "Summarize quantum computing in one sentence"

steps:
  # Layer 1: two parallel calls — each retries 3 times (4 attempts each).
  # Combined: 8 failures on the same circuit breaker (threshold = 5).
  - id: call_a
    type: llm_call
    prompt: "{state.prompt_a}"
    output: answer_a
    retry:
      max_retries: 3

  - id: call_b
    type: llm_call
    prompt: "{state.prompt_b}"
    output: answer_b
    retry:
      max_retries: 3

  # Layer 2: depends on a+b, so it runs after the circuit has opened.
  # The circuit is open: this step never reaches the provider.
  - id: call_c
    type: llm_call
    prompt: "{state.prompt_c}"
    output: answer_c
    depends_on: [call_a, call_b]
    retry:
      max_retries: 1
