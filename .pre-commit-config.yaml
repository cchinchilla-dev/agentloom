# Local hooks run the tools pinned in uv.lock, so a commit is checked exactly like CI.
# `system` instead of `unsupported` keeps pre-commit 3.x (the pyproject minimum) working.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
        files: ^(src|tests)/  # same paths CI checks
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        files: ^(src|tests)/  # same paths CI checks
      - id: version-linearity
        name: version linearity (pyproject.toml, CHANGELOG.md, __version__, Chart appVersion)
        entry: uv run python scripts/check_version_linearity.py
        language: system
        files: ^(pyproject\.toml|CHANGELOG\.md|src/[^/]+/__init__\.py|deploy/helm/agentloom/Chart\.yaml)$
        pass_filenames: false
      - id: no-history-comments
        name: no history in comments (SKIP=no-history-comments to bypass)
        language: pygrep
        entry: '#(?!.*\bnoqa\b).*(\b[Pp]re-\d+\.\d+|\b[Pp]ost-\d+\.\d+|\b[Pp]re-fix\b|\b[Rr]egression for #|\b(HIGH|MEDIUM|LOW)-\d+\b|\bF\d{1,3}\b)'
        types: [python]
        files: ^(src|tests)/
        exclude: ^tests/scripts/test_history_hook\.py$
